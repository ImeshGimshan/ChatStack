events {
    worker_connections 1024;
}

http {
    # Set headers to pass original client info to the services
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        # ---- Auth Service ----
        location /api/auth/ {
            proxy_pass http://auth-service:8080/api/auth/;
        }
        location /api/internal/users/ {
            proxy_pass http://auth-service:8080/api/internal/users/;
        }

        # ---- User Service ----
        location /api/profile/ {
            proxy_pass http://user-service:5010/api/profile/;
        }

        # ---- Social Service ----
        location /api/connection/ {
            proxy_pass http://social-service:3334/api/connection/;
        }

        # ---- Media Service ----
        location /media/ {
            proxy_pass http://media-service:3004/media/;
        }

        # ---- Chat Service (REST + WebSockets) ----
        location ~ ^/(chat|comments|conversation|channels|posts|keys|server)/ {
            proxy_pass http://chat-service:3333;
        }

        # Special location for Socket.io to support WebSockets in chat-service
        location /socket.io/ {
            proxy_pass http://chat-service:3333;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
