name: Chat Service CI/CD

on:
  workflow_dispatch:
  push:
    paths:
      - 'chat-service/**'
    branches: [main]
  pull_request:
    paths:
      - 'chat-service/**'

env:
  ACR_REGISTRY: chatstackregistryv1.azurecr.io
  IMAGE_NAME: chatstack-chat-service
  AKS_RESOURCE_GROUP: chatstack-rg
  AKS_CLUSTER_NAME: chatstack-aks
  DEPLOYMENT_NAME: chat-deployment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './chat-service/package-lock.json'
      - name: Install dependencies
        working-directory: ./chat-service
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./chat-service
        run: npx prisma generate
        env:
          CHAT_DATABASE_URL: ${{ secrets.CHAT_DATABASE_URL }}
      - name: Build
        working-directory: ./chat-service
        run: npm run build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CHAT_DATABASE_URL: ${{ secrets.CHAT_DATABASE_URL }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chat-service-dist
          path: ./chat-service/dist

  build-and-push:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Log in to Azure Container Registry
        run: az acr login --name chatstackregistryv1
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./chat-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
      - name: Deploy to AKS
        run: |
          kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }}
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=120s
