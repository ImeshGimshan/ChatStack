spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/test_postgres
    username: test_user
    password: test_password
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always