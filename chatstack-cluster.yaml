  ports:
    - port: 3000
      targetPort: 3000

# 6. USER SERVICE (Express.js + MongoDB) — port 5010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: chatstackregistryv1.azurecr.io/chatstack-user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5010
          env:
            - name: PORT
              value: "5010"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: JWT_SECRET
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: chatstack-config
                  key: AUTH_SERVICE_URL
            - name: NODE_ENV
              value: "production"
            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: CORS_ORIGIN
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - port: 5010
      targetPort: 5010
      nodePort: 30010