# Deploy with:
#   kubectl apply -f chatstack-secrets.yaml
#   kubectl apply -f chatstack-config.yaml
#   kubectl apply -f chatstack-cluster.yaml

# 1. AUTH SERVICE (Spring Boot / Java 17) — port 8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: chatstackregistryv1.azurecr.io/chatstack-auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: JWT_SECRET
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: SPRING_RABBITMQ_HOST
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: SPRING_RABBITMQ_PORT
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: SPRING_RABBITMQ_USERNAME
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: SPRING_RABBITMQ_PASSWORD
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: SPRING_RABBITMQ_VIRTUAL_HOST
            - name: SPRING_RABBITMQ_SSL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: SPRING_RABBITMQ_SSL_ENABLED
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: GMAIL_USER
            - name: GMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: GMAIL_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

# 2. CHAT SERVICE (NestJS + Prisma) — port 3333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-deployment
  labels:
    app: chat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: chatstackregistryv1.azurecr.io/chatstack-chat-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3333
          env:
            - name: PORT
              value: "3333"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: JWT_SECRET
            - name: CHAT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: CHAT_DATABASE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: CHAT_DATABASE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: chatstack-config
                  key: AUTH_SERVICE_URL
            - name: SOCIAL_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: chatstack-config
                  key: SOCIAL_SERVICE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chatstack-secrets
                  key: REDIS_URL
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
spec:
  type: NodePort
  selector:
    app: chat-service
  ports:
    - port: 3333
      targetPort: 3333
      nodePort: 30333

