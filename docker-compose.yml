services:
  # ── Auth Service (Spring Boot / Java 17) ────────
  auth-service:
    build: ./AuthService
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_RABBITMQ_VIRTUAL_HOST=${SPRING_RABBITMQ_VIRTUAL_HOST}
      - SPRING_RABBITMQ_SSL_ENABLED=${SPRING_RABBITMQ_SSL_ENABLED}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_PASS=${GMAIL_PASS}
    networks:
      - app-network

  # ── Chat Service (NestJS + Prisma) ─────────────
  chat-service:
    build: ./chat-service
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file: .env
    environment:
      - PORT=3333
      - JWT_SECRET=${JWT_SECRET}
      - CHAT_DATABASE_URL=${CHAT_DATABASE_URL}
      - DATABASE_URL=${CHAT_DATABASE_URL}
      - AUTH_SERVICE_URL=http://auth-service:8080
      - SOCIAL_SERVICE_URL=http://social-service:3334
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - auth-service
    networks:
      - app-network

  # ── Social Service (NestJS + Prisma) ───────────
  social-service:
    build: ./social-service
    container_name: social-service
    restart: unless-stopped
    ports:
      - "3334:3334"
    env_file: .env
    environment:
      - PORT=3334
      - SOCIAL_DATABASE_URL=${SOCIAL_DATABASE_URL}
      - DATABASE_URL=${SOCIAL_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - app-network

  # ── Media Service (NestJS + Cloudinary) ────────
  media-service:
    build: ./media-service
    container_name: media-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file: .env
    environment:
      - PORT=3004
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    networks:
      - app-network

  # ── Email Service (NestJS + RabbitMQ) ──────────
  email-service:
    build: ./email-service
    container_name: email-service
    restart: unless-stopped
    env_file: .env
    environment:
      - RABBIT_MQ_URL=${RABBIT_MQ_URL}
      - GMAIL_PASS=${GMAIL_PASS}
      - GMAIL_USER=${GMAIL_USER}
    networks:
      - app-network

  # ── User Service (Express.js + MongoDB) ────────
  user-service:
    build: ./user-service
    container_name: user-service
    restart: unless-stopped
    ports:
      - "5010:5010"
    env_file: .env
    environment:
      - PORT=${USER_SERVICE_PORT}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:8080
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - auth-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge