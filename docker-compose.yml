version: "3.8"

services:
  auth-service:
    build: ./AuthService
    container_name: auth-service-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_RABBITMQ_VIRTUAL_HOST=${SPRING_RABBITMQ_VIRTUAL_HOST}
      - SPRING_RABBITMQ_SSL_ENABLED=${SPRING_RABBITMQ_SSL_ENABLED}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_PASS=${GMAIL_PASS}
    networks:
      - app-network
  social-service:
    build: ./social-service
    container_name: social-service-container
    ports:
      - "3334:3334"
    environment:
      - PORT=3334
      - SOCIAL_DATABASE_URL=${SOCIAL_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - app-network

  chat-service:
    build: ./chat-service
    container_name: chat-service-container
    ports:
      - "3333:3333"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - CHAT_DATABASE_URL=${CHAT_DATABASE_URL}
      - AUTH_SERVICE_URL=http://auth-service:8080
      - SOCIAL_SERVICE_URL=http://social-service:3334
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - auth-service
    networks:
      - app-network

  media-service:
    build: ./media-service
    container_name: media-service-container
    ports:
      - "3004:3004"
    environment:
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    networks:
      - app-network
    
  email-service:
    build: ./email-service
    container_name: email-service-container
    environment:
      - RABBIT_MQ_URL=${RABBIT_MQ_URL}
      - GMAIL_PASS=${GMAIL_PASS}
      - GMAIL_USER=${GMAIL_USER}
    networks:
      - app-network


  # User Profile Service (Node.js + MongoDB)
  user-service:
    build: ./user-service
    container_name: user-service-container
    restart: unless-stopped
    ports:
      - "5010:5010"
    environment:
      PORT: ${USER_SERVICE_PORT}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8080
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - app-network
  

 

  # frontend:
  #   build: ./Frontend
  #   container_name: frontend-container
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_AUTH_API=http://localhost:8080
  #     - NEXT_PUBLIC_CHAT_API=http://localhost:3333
  #     - NEXT_PUBLIC_MEDIA_API=http://localhost:3004
  #   volumes:
  #     - ./Frontend:/app
  #     - /app/node_modules
  #   depends_on:
  #     - auth-service
  #     - chat-service
  #     - media-service
  #   networks:
  #     - app-network

  api-gateway:
    image: nginx:latest
    container_name: api-gateway-container
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - chat-service
      - social-service
      - media-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes: {}